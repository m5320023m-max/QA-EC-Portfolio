<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>商品詳細</title>
    </head>
    <body>
        <h1>商品詳細</h1>
        <h2 id="product-name">テスト商品A</h2>
        <p id="product-price">1000円</p>
        <label>
            数量
            <input type="number" id="quantity" value="1" min="1">
        </label>
        <button id="add-cart">カートへ追加</button>

        <p>
            カート数量：<span id="cart-count">0</span>
        </p>

        <a href="cart.html" id="cart-link">カートを見る</a>

        <script src="script.js"></script>
    </body>
</html>
